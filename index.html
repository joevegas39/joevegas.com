<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Study Space</title>
  <link rel="stylesheet" href="style.css">

    <style>
    /* ===== RESET & BASICS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body.home-body {
      /* Modern colorful gradient */
      background: linear-gradient(135deg, #4a5faa, #aa436c, #ff9a9e, #fad0c4);
      background-size: 300% 300%;
      animation: gradientShift 10s ease infinite;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== NAVBAR ===== */
    .navbar {
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      flex-wrap: wrap;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .navbar h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }

    .navbar ul {
      display: flex;
      list-style: none;
    }

    .navbar ul li a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
      transition: 0.3s;
    }

    .navbar ul li a:hover,
    .navbar ul li a.active {
      color: #ffd700;
    }

    /* ===== HERO SECTION ===== */
    .hero {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .hero-text {
      max-width: 700px;
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 25px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(8px);
      transition: transform 0.4s ease;
    }

    .hero-text:hover {
      transform: scale(1.02);
    }

    .hero-text h2 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      color: #fff;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
    }

    .hero-text p {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #f5f5f5;
    }

    .btn {
      background: #ffd700;
      color: #333;
      padding: 0.8rem 1.5rem;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s ease;
    }

    .btn:hover {
      background: #fff;
      transform: scale(1.05);
    }

    /* ===== FOOTER ===== */
    footer {
      text-align: center;
      padding: 1rem 0;
      background: rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        text-align: center;
      }

      .navbar ul {
        margin-top: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .hero-text h2 {
        font-size: 1.7rem;
      }

      .hero-text p {
        font-size: 1rem;
      }

      .btn {
        padding: 0.7rem 1.2rem;
      }
    }

    @media (min-width: 1200px) {
      .hero-text h2 {
        font-size: 2.5rem;
      }

      .hero-text p {
        font-size: 1.2rem;
      }
    }
  </style>

	
</head>
<body>
  <nav class="navbar">
    <h1>My Study Space</h1>
    <ul>
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="books.html">Books</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-text">
      <h2>Welcome to My Study Space 📚</h2>
      <p>All your school books and notes in one clean, colorful place.</p>
      <a href="books.html" class="btn">Go to Books</a>
    </div>
  </section>

  <footer>
    <p>© 2025 My Study Space | Designed by Me</p>
  </footer>
</body>
</html>
