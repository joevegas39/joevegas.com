<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Books</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* ===== RESET & BASICS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body.books-body {
      background: linear-gradient(135deg, #4a5faa, #aa436c, #ff9a9e, #fad0c4);
      background-size: 300% 300%;
      animation: gradientShift 10s ease infinite;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== NAVBAR ===== */
    .navbar {
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      flex-wrap: wrap;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .navbar h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }

    .navbar ul {
      display: flex;
      list-style: none;
    }

    .navbar ul li a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
      transition: 0.3s;
    }

    .navbar ul li a:hover,
    .navbar ul li a.active {
      color: #ffd700;
    }

    /* ===== BOOKS SECTION ===== */
    .books-section {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .books-section h2 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
    }

    .search-bar {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .search-bar input {
      padding: 0.7rem 1rem;
      border-radius: 25px;
      border: none;
      outline: none;
      width: 250px;
      max-width: 80%;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
    }

    .search-bar button {
      background: #ffd700;
      border: none;
      border-radius: 25px;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
      font-weight: 600;
      color: #333;
      transition: 0.3s ease;
    }

    .search-bar button:hover {
      background: #fff;
      transform: scale(1.05);
    }

    .book-list {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .book-card {
      background: rgba(255, 255, 255, 0.1);
      padding: 1.5rem;
      border-radius: 20px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .book-card:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.2);
    }

    .book-card h3 {
      margin-bottom: 0.8rem;
      color: #fff;
    }

    .book-card .btn {
      display: inline-block;
      margin-top: 0.5rem;
      background: #ffd700;
      color: #333;
      padding: 0.5rem 1rem;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s ease;
    }

    .book-card .btn:hover {
      background: #fff;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 1rem 0;
      background: rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        text-align: center;
      }
      .navbar ul {
        margin-top: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
  
</head>
<body>
  <nav class="navbar">
    <h1>My Study Space</h1>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="books.html" class="active">Books</a></li>
    </ul>
  </nav>

  <section class="books-section">
    <h2>My Books</h2>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search book...">
    </div>
    <div id="bookList" class="book-list">
      <!-- Books will be loaded here by JavaScript -->
    </div>
  </section>

  <footer>
    <p>© 2025 My Study Space | Designed by Me</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
